    WHAT IS HTML?
    —————————————
    - HTML stands for HyperText Markup Language.
    - It is the standard language used to create and structure content on web pages.
    - HTML is NOT a programming language — it is a MARKUP language.
    - It uses "tags" (like <h1>, <p>, <a>) to define the structure of a webpage.
    - Browsers (Chrome, Firefox, Safari) read HTML files and render them as visual pages.

    HISTORY OF HTML
    ———————————————
    - 1989: Tim Berners-Lee (a scientist at CERN, Switzerland) invented the World Wide Web.
            He needed a way to share research documents between scientists across the world.
            So he created HTML as the language to write those documents.

    - 1991: HTML 1.0 released — very basic, only supported text and links.
            No images, no tables, no forms.

    - 1995: HTML 2.0 — first standard version, added forms and basic input fields.

    - 1997: HTML 3.2 — added tables, applets, and text flow around images.

    - 1999: HTML 4.01 — major release, added CSS support, scripting, better forms,
            accessibility features. This was the dominant version for nearly a decade.

    - 2014: HTML5 — the current and most powerful version.
            Added: audio, video, canvas, semantic tags (header, nav, section, footer),
            local storage, geolocation, drag-and-drop, and much more.
            HTML5 is maintained by WHATWG (Web Hypertext Application Technology Working Group).

    Timeline:
    1991        1995        1997        1999        2014 - Present
    HTML 1.0 -> HTML 2.0 -> HTML 3.2 -> HTML 4.01 -> HTML5


    WHO CREATED HTML?
    —————————————————
    - Tim Berners-Lee — often called the "Father of the Web."
    - He also created HTTP (protocol) and the first web browser.
    - Currently maintained by W3C (World Wide Web Consortium) and WHATWG.


    USE CASES OF HTML
    —————————————————
    - Building websites and web applications (literally every website uses HTML)
    - Creating email templates (emails are written in HTML)
    - Structuring content for blogs, news sites, e-commerce stores
    - Building forms to collect user data (login, signup, contact)
    - Embedding multimedia (videos, audio, maps)
    - Creating documentation and technical guides
    - Serving as the skeleton for any frontend framework (React, Angular, Vue — all output HTML)


    KEY POINTS TO REMEMBER
    ———————————————————————
    - HTML provides STRUCTURE (skeleton of the page)
    - CSS provides STYLE (how it looks — colors, fonts, layout)
    - JavaScript provides BEHAVIOR (interactivity — clicks, animations, logic)

    Together they form the foundation of every website:
    HTML = Structure | CSS = Presentation | JS = Functionality


    WHY IS IT CALLED "HYPERTEXT"?
    ——————————————————————————————
    - "Hyper" means beyond / above normal text.
    - Normal text is linear — you read top to bottom.
    - HyperText allows you to JUMP from one document to another using LINKS.
    - That's the core idea of the web — documents connected by links.


    FILE EXTENSION
    ——————————————
    - HTML files use .html or .htm extension
    - The browser reads this file and renders the content visually
    - No compilation needed — HTML is interpreted directly by the browser
