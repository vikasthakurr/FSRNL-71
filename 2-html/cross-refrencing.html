    <!--
      ============================================
      ANCHOR TAG (<a>) IN HTML - NOTES
      ============================================

      The <a> (anchor) tag is used to create hyperlinks — the core
      of web navigation. It connects one page to another, or links
      to sections within the same page.

      SYNTAX:
        <a href="URL">Link Text</a>

      IMPORTANT ATTRIBUTES:
        href        → The destination URL or target
                      • Absolute URL: href="https://google.com"
                      • Relative URL: href="about.html"
                      • Section/ID link: href="#sectionId" (cross-referencing)
                      • Email: href="mailto:user@example.com"
                      • Phone: href="tel:+919068003323"
                      • Download: href="file.pdf" (with download attribute)

        target      → Where to open the link
                      • _self    → Same tab (default)
                      • _blank   → New tab/window
                      • _parent  → Parent frame
                      • _top     → Full body of the window

        rel         → Relationship between current and linked document
                      • noopener  → Prevents new page from accessing window.opener
                      • noreferrer → Hides referrer info from the linked page
                      • nofollow  → Tells search engines not to follow this link
                      • Use rel="noopener noreferrer" with target="_blank" for security

        download    → Prompts file download instead of navigation
                      e.g., <a href="file.pdf" download>Download PDF</a>

        title       → Tooltip text on hover

      CROSS-REFERENCING (Same Page Navigation):
        - Give a section an id:  <section id="footer">...</section>
        - Link to it: <a href="#footer">Go to Footer</a>
        - Clicking the link scrolls to that section
        - This is also called "bookmark linking" or "anchor linking"
        - Works with any element that has an id attribute

      LINKING TO ANOTHER PAGE'S SECTION:
        <a href="otherpage.html#section-id">Go to section</a>

      WRAPPING OTHER ELEMENTS:
        - In HTML5, <a> can wrap block-level elements (images, divs, etc.)
        - Example: <a href="url"><img src="image.jpg" alt="..." /></a>

      BEST PRACTICES:
        - Always use descriptive link text (avoid "click here")
        - Use rel="noopener noreferrer" with target="_blank"
        - Provide meaningful alt text when wrapping images
        - Use title attribute for additional context
        - Ensure links are keyboard accessible (they are by default)
        - Use proper contrast for link colors (accessibility)

      STATES (for CSS styling):
        a:link     → Unvisited link
        a:visited  → Already visited link
        a:hover    → Mouse is over the link
        a:active   → Link being clicked
        (Remember order: LVHA — LoVe HAte)
      ============================================
    -->

    <!-- Example: Cross-referencing - link to a section by id -->
    <!-- <a href="#footer">Click here to go footer page</a> -->
