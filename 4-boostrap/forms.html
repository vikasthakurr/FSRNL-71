<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Forms</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="container py-4">
    <h1 class="text-center mb-4">Bootstrap Forms</h1>

    <!-- NOTES:
        - .form-control for text inputs, textareas, selects
        - .form-label for labels
        - .form-select for select dropdowns
        - .form-check for checkboxes and radios
        - .form-check-inline for inline checkboxes/radios
        - .form-switch for toggle switches
        - .form-range for range inputs
        - .form-floating for floating labels
        - .input-group for input groups with addons
        - Sizing: .form-control-lg, .form-control-sm
        - Validation: .is-valid, .is-invalid, .valid-feedback, .invalid-feedback
        - .form-text for helper text below inputs
        - .row and .col for horizontal form layout
    -->

    <!-- Basic Form -->
    <section class="mb-5">
      <h2>Basic Form</h2>
      <form>
        <div class="mb-3">
          <label for="emailInput" class="form-label">Email address</label>
          <input
            type="email"
            class="form-control"
            id="emailInput"
            placeholder="name@example.com"
          />
          <div class="form-text">We'll never share your email.</div>
        </div>
        <div class="mb-3">
          <label for="passwordInput" class="form-label">Password</label>
          <input type="password" class="form-control" id="passwordInput" />
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="rememberCheck" />
          <label class="form-check-label" for="rememberCheck"
            >Remember me</label
          >
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
    </section>
  </body>
</html>

<!-- Form Controls -->
<section class="mb-5">
  <h2>Form Controls (Different Input Types)</h2>
  <form>
    <div class="mb-3">
      <label for="textInput" class="form-label">Text Input</label>
      <input
        type="text"
        class="form-control"
        id="textInput"
        placeholder="Enter text"
      />
    </div>
    <div class="mb-3">
      <label for="selectInput" class="form-label">Select Menu</label>
      <select class="form-select" id="selectInput">
        <option selected>Choose an option</option>
        <option value="1">Option One</option>
        <option value="2">Option Two</option>
        <option value="3">Option Three</option>
      </select>
    </div>
    <div class="mb-3">
      <label for="textareaInput" class="form-label">Textarea</label>
      <textarea class="form-control" id="textareaInput" rows="3"></textarea>
    </div>
    <div class="mb-3">
      <label for="fileInput" class="form-label">File Input</label>
      <input class="form-control" type="file" id="fileInput" />
    </div>
    <div class="mb-3">
      <label for="colorInput" class="form-label">Color Picker</label>
      <input
        type="color"
        class="form-control form-control-color"
        id="colorInput"
        value="#563d7c"
      />
    </div>
    <div class="mb-3">
      <label for="dateInput" class="form-label">Date Input</label>
      <input type="date" class="form-control" id="dateInput" />
    </div>
  </form>
</section>

<!-- Checkboxes & Radios -->
<section class="mb-5">
  <h2>Checkboxes & Radios</h2>
  <h5>Checkboxes</h5>
  <div class="form-check">
    <input
      class="form-check-input"
      type="checkbox"
      value=""
      id="check1"
      checked
    />
    <label class="form-check-label" for="check1">Checked checkbox</label>
  </div>
  <div class="form-check">
    <input class="form-check-input" type="checkbox" value="" id="check2" />
    <label class="form-check-label" for="check2">Default checkbox</label>
  </div>

  <h5 class="mt-3">Radio Buttons</h5>
  <div class="form-check">
    <input
      class="form-check-input"
      type="radio"
      name="radioGroup"
      id="radio1"
      checked
    />
    <label class="form-check-label" for="radio1">First radio</label>
  </div>
  <div class="form-check">
    <input
      class="form-check-input"
      type="radio"
      name="radioGroup"
      id="radio2"
    />
    <label class="form-check-label" for="radio2">Second radio</label>
  </div>

  <h5 class="mt-3">Switches</h5>
  <div class="form-check form-switch">
    <input class="form-check-input" type="checkbox" id="switch1" checked />
    <label class="form-check-label" for="switch1">Enabled switch</label>
  </div>
  <div class="form-check form-switch">
    <input class="form-check-input" type="checkbox" id="switch2" />
    <label class="form-check-label" for="switch2">Disabled switch</label>
  </div>
</section>

    <!-- Floating Labels -->
    <section class="mb-5">
        <h2>Floating Labels</h2>
        <div class="form-floating mb-3">
            <input type="email" class="form-control" id="floatingEmail" placeholder="name@example.com">
            <label for="floatingEmail">Email address</label>
        </div>
        <div class="form-floating mb-3">
            <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
            <label for="floatingPassword">Password</label>
        </div>
        <div class="form-floating">
            <textarea class="form-control" placeholder="Comment" id="floatingTextarea" style="height: 100px"></textarea>
            <label for="floatingTextarea">Comments</label>
        </div>
    </section>

    <!-- Input Groups -->
    <section class="mb-5">
        <h2>Input Groups</h2>
        <div class="input-group mb-3">
            <span class="input-group-text">@</span>
            <input type="text" class="form-control" placeholder="Username">
        </div>
        <div class="input-group mb-3">
            <input type="text" class="form-control" placeholder="Email">
            <span class="input-group-text">@example.com</span>
        </div>
        <div class="input-group mb-3">
            <span class="input-group-text">$</span>
            <input type="number" class="form-control" placeholder="Amount">
            <span class="input-group-text">.00</span>
        </div>
        <div class="input-group">
            <input type="text" class="form-control" placeholder="Search...">
            <button class="btn btn-primary" type="button">Search</button>
        </div>
    </section>

    <!-- Form Sizing -->
    <section class="mb-5">
        <h2>Form Sizing</h2>
        <input class="form-control form-control-lg mb-2" type="text" placeholder="Large input">
        <input class="form-control mb-2" type="text" placeholder="Default input">
        <input class="form-control form-control-sm" type="text" placeholder="Small input">
    </section>

    <!-- Validation -->
    <section class="mb-5">
        <h2>Validation States</h2>
        <div class="mb-3">
            <label class="form-label">Valid Input</label>
            <input type="text" class="form-control is-valid" value="Correct value">
            <div class="valid-feedback">Looks good!</div>
        </div>
        <div class="mb-3">
            <label class="form-label">Invalid Input</label>
            <input type="text" class="form-control is-invalid" value="">
            <div class="invalid-feedback">Please provide a value.</div>
        </div>
    </section>

</body>
</html>
