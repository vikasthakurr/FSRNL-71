<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .container {
        width: 900px;
        height: 700px;
        background-color: beige;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        /* row-gap: 10px;
        column-gap: 10px; */
        gap: 10px;
        grid-template-areas: "header header header" "sidebar content-1 content-1" "sidebar content-2 content-3" "footer footer footer";
      }
      .child {
        background-color: red;
        /* height: 100px;
        width: 100px; */
        /* margin: 5px; */
        display: flex;
        justify-content: center;
        align-items: center;
      }
      /* .child-1{
        grid-column-start: 1;
        grid-column-end: 4;
      }
      .child-2{
        grid-row-start: 2;
        grid-row-end: 4;
      } */
      .header {
        grid-area: header;
      }
      .sidebar {
        grid-area: sidebar;
      }
      .content-1 {
        grid-area: content-1;
      }
      .content-2 {
        grid-area: content-2;
      }
      .content-3 {
        grid-area: content-3;
      }
      .footer {
        grid-area: footer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="child header">child-1</div>
      <div class="child sidebar">child-2</div>
      <div class="child content-1">child-3</div>
      <div class="child content-2">child-4</div>
      <div class="child content-3">child-5</div>
      <div class="child footer">child-6</div>
    </div>
  </body>
</html>
